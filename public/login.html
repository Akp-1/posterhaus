<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PosterHaus Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f7f4; --surface: #fff; --border: #e8e5e0;
    --text: #1a1916; --muted: #8a8680; --accent: #2c2c2c;
    --gold: #b8945a; --radius: 4px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    background: var(--surface);
    padding: 40px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .logo span { color: var(--gold); }
  .logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; text-align: left; }
  .form-label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.05em; }
  .form-input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    padding: 12px;
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--gold); }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    padding: 14px;
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    transition: opacity 0.2s;
    margin-top: 10px;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  #error-msg {
    color: #c44;
    font-size: 11px;
    margin-top: 12px;
    padding: 8px;
    background: #fde8e8;
    border-radius: var(--radius);
    display: none;
  }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="login-box">
    <div class="logo">Poster<span>Haus</span></div>
    <!-- ── UPDATE THIS ─────────────────────────────────────────────────────
         Change "BrandAid Stall" to whatever your event/org name is
    ──────────────────────────────────────────────────────────────────────── -->
    <div class="logo-sub">BRANDAID STALL · ADMIN PANEL</div>

    <div class="form-group">
      <label class="form-label">USERNAME</label>
      <input class="form-input" type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="form-group">
      <label class="form-label">PASSWORD</label>
      <input class="form-input" type="password" id="password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') login()">
    </div>
    <button class="btn-primary" id="login-btn" onclick="login()">LOGIN →</button>
    <div id="error-msg">Invalid username or password.</div>
  </div>

  <script>
    // ── FIXED: check if already logged in and redirect immediately ────────────
    (async () => {
      try {
        const res = await fetch('/api/me');
        if (res.ok) window.location.replace('/admin.html');
      } catch (_) {}
    })();

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errMsg   = document.getElementById('error-msg');

      if (!username || !password) {
        errMsg.textContent = 'Please enter both username and password.';
        errMsg.style.display = 'block';
        return;
      }

      // Show loading state
      btn.disabled   = true;
      btn.innerHTML  = '<span class="spinner"></span>Logging in...';
      errMsg.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          // ── FIXED: redirect to admin after successful login ──────────────
          window.location.href = '/admin.html';
        } else {
          const data = await res.json().catch(() => ({}));
          errMsg.textContent = data.error || 'Invalid username or password.';
          errMsg.style.display = 'block';
          btn.disabled  = false;
          btn.innerHTML = 'LOGIN →';
        }
      } catch (err) {
        errMsg.textContent = 'Cannot reach server. Check your connection.';
        errMsg.style.display = 'block';
        btn.disabled  = false;
        btn.innerHTML = 'LOGIN →';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PosterHaus Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f7f4; --surface: #fff; --border: #e8e5e0;
    --text: #1a1916; --muted: #8a8680; --accent: #2c2c2c;
    --gold: #b8945a; --radius: 4px;
  }
  body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); font-size: 13px; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .login-box { background: var(--surface); padding: 40px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 360px; text-align: center; }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; margin-bottom: 24px; }
  .logo span { color: var(--gold); }
  .form-group { margin-bottom: 16px; text-align: left; }
  .form-label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.05em; }
  .form-input { width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--bg); padding: 12px; border-radius: var(--radius); font-family: 'DM Mono', monospace; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--gold); }
  .btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; cursor: pointer; padding: 14px; border-radius: var(--radius); font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.08em; transition: opacity 0.2s; margin-top: 10px; }
  .btn-primary:hover { opacity: 0.85; }
  #error-msg { color: #c44; font-size: 11px; margin-top: 12px; display: none; }
</style>
</head>
<body>
  <div class="login-box">
    <div class="logo">Poster<span>Haus</span> Admin</div>
    <form id="login-form" onsubmit="login(event)">
      <div class="form-group">
        <label class="form-label">USERNAME</label>
        <input class="form-input" type="text" id="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input class="form-input" type="password" id="password" required>
      </div>
      <button type="submit" class="btn-primary">LOGIN</button>
      <div id="error-msg">Invalid username or password.</div>
    </form>
  </div>

  <script>
    async function login(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      if (res.ok) {
        window.location.href = '/admin.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
